services:
  postgres:
    image: postgres:16
    container_name: mordheim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mordheim_builder
      POSTGRES_USER: mordheim
      POSTGRES_PASSWORD: mordheim
    ports:
      - "5432:5432"
    volumes:
      - mordheim_pgdata:/var/lib/postgresql/data

volumes:
  mordheim_pgdata:
